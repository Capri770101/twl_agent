<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>跳舞兰 · 调用监控</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- 登录遮罩：密钥只存在 sessionStorage，不落盘、不进前端源码 -->
  <div id="login" class="login-mask">
    <div class="login-card">
      <div class="login-logo">🌼 跳舞兰</div>
      <h2>调用监控面板</h2>
      <p class="login-sub">请输入 DASHBOARD_API_KEY 进入（仅本次会话有效）</p>
      <input id="keyInput" type="password" placeholder="DASHBOARD_API_KEY" autocomplete="off" />
      <button id="loginBtn">进入面板</button>
      <p id="loginErr" class="login-err"></p>
    </div>
  </div>

  <!-- 主面板 -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">🌼 跳舞兰 · 调用监控</div>
      <div class="status">
        <span id="connDot" class="dot off"></span>
        <span id="connText">连接中…</span>
        <span class="sep">·</span>
        <span id="updated">—</span>
      </div>
      <button id="logoutBtn" class="ghost">退出</button>
    </header>

    <section class="kpis">
      <div class="kpi"><div class="kpi-label">累计调用</div><div class="kpi-val" id="kpiTotal">—</div></div>
      <div class="kpi"><div class="kpi-label">近 24h 调用</div><div class="kpi-val" id="kpi24h">—</div></div>
      <div class="kpi"><div class="kpi-label">近 24h 错误率</div><div class="kpi-val" id="kpiErr">—</div></div>
      <div class="kpi"><div class="kpi-label">近 24h 活跃平台</div><div class="kpi-val" id="kpiPlat">—</div></div>
      <div class="kpi"><div class="kpi-label">近 24h 平均延迟</div><div class="kpi-val" id="kpiLat">—</div></div>
    </section>

    <section class="grid">
      <div class="card span2">
        <h3>调用量趋势（近 24h，按小时）</h3>
        <canvas id="callsChart"></canvas>
      </div>
      <div class="card">
        <h3>实时调用流</h3>
        <ul id="liveFeed" class="feed"></ul>
      </div>
      <div class="card">
        <h3>平台接入与活跃度</h3>
        <canvas id="platformChart"></canvas>
      </div>
      <div class="card">
        <h3>工具调用分布</h3>
        <canvas id="toolChart"></canvas>
      </div>
      <div class="card">
        <h3>错误率趋势（近 24h，按小时）</h3>
        <canvas id="errorChart"></canvas>
      </div>
    </section>
  </div>

  <script src="./vendor/chart.umd.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
