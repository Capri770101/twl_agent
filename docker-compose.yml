services:
  postgres:
    image: postgres:16-alpine
    container_name: flora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: flora_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flora -d flora_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 按需对外暴露端口（默认仅容器网络内可见，更安全）：
    # ports:
    #   - "5432:5432"

  agent:
    build: .
    container_name: flora-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    # 若使用上方 postgres 容器，.env 中 DATABASE_URL 写：
      # postgresql://flora:${POSTGRES_PASSWORD}@postgres:5432/flora_agent
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 可选：Nginx 反向代理（HTTPS + SSE）。
  # 启用方式：docker compose --profile nginx up -d
  # 证书：deploy/certs/{fullchain,privkey}.pem
  #   - 阿里云免费证书（推荐，大陆服务器）：控制台下载 Nginx 格式，解压后重命名放进来
  #   - 或用 python scripts/install_cert.py <证书zip> 一键安装
  nginx:
    image: nginx:alpine
    container_name: flora-nginx
    restart: unless-stopped
    profiles: ["nginx"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/webroot:/var/www/certbot:ro
    depends_on:
      - agent

volumes:
  pgdata:
