name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flora_agent_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flora_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/flora_agent_test
      FLORA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/flora_agent_test
      REMINDER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/flora_agent_test
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (ruff, blocking)
        run: python -m ruff check agent backend domain scripts tests main.py verify.py
      - name: Type check domain and extracted modules (mypy, blocking)
        run: python -m mypy domain agent/safety/reasoning.py agent/safety/image_claim.py agent/safety/card_claim.py agent/safety/platform_evidence.py agent/engine/prompt_templates.py agent/engine/card_summary.py agent/engine/clarification.py agent/engine/cleanup.py agent/engine/signals.py agent/design/quantities.py agent/design/instructions.py agent/design/copy_text.py agent/design/stem_allocation.py agent/design/price_breakdown.py agent/design/visual_revision.py agent/design/revision_input.py --follow-imports=silent
      - name: Type check agent/backend (mypy, advisory)
        run: python -m mypy agent backend || true
      - name: Compile Python sources
        run: python -m compileall -q agent backend domain scripts tests main.py verify.py
      - name: Validate offline evaluation scenarios
        run: python scripts/validate_eval_set.py
      - name: Verify application imports
        run: python verify.py
      - name: Run test suite
        run: python -m pytest -q
