# 花艺智能体 Nginx 反向代理配置（api.tiaowulan.com）
#
# 证书统一放在 deploy/certs/（compose 挂载到 /etc/nginx/certs）：
#   fullchain.pem  证书链
#   privkey.pem    私钥
#
# 来源一（推荐，大陆服务器）：阿里云免费证书（数字证书管理服务 → 免费证书 → 下载 Nginx 格式）
#   有效期 3 个月，到期需重新申请下载并覆盖这两个文件，然后 sudo docker restart flora-nginx
# 来源二：Let's Encrypt（本服务器对 acme-v02 出站被墙，仅备用）
#   sudo docker run --rm -p 80:80 -v /opt/flora_agent_package/deploy/letsencrypt:/etc/letsencrypt \
#     certbot/certbot certonly --standalone -d api.tiaowulan.com -n --agree-tos --register-unsafely-without-email
#   签发后 cp deploy/letsencrypt/live/api.tiaowulan.com/{fullchain,privkey}.pem deploy/certs/
#   自动续期：deploy/renew-cert.sh（已配 root cron，每周一凌晨 3 点）

# Docker 内置 DNS：变量式 proxy_pass（见下方 /demo-api/）必须显式指定 resolver，
# 否则 nginx 报 "no resolver defined to resolve agent-demo" 并对该路径返回 502。
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP：ACME 验证 + 全量跳转 HTTPS
server {
    listen 80;
    server_name api.tiaowulan.com www.api.tiaowulan.com;

    # Let's Encrypt HTTP-01 验证路径（续期用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.tiaowulan.com www.api.tiaowulan.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 上传/请求体上限（对话消息一般很小，图片上传场景可调大）
    client_max_body_size 10m;

    # ── 智能体 API ──
    # ⚠️⚠️ 必须用**变量式** proxy_pass（配顶层 resolver）：静态写法 `proxy_pass http://agent:8000`
    # 只在 nginx 启动时解析一次并**永久缓存 IP** —— agent 容器重建换 IP 后，请求会打到抢占到
    # 该 IP 的**另一个容器**。2026-09-17 实测：请求被发到了演示实例 agent-demo（它的
    # PLATFORM_API_KEYS 里没有生产的 key）→ 表现为「API key 失效，一直 401」，极难排查。
    # 变量式等价于原静态写法（变量不含 URI → 使用原始 $uri）。
    location / {
        set $agent_be http://agent:8000;
        proxy_pass $agent_be;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式对话支持（/chat/stream）
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 生图结果静态托管（可选：也可换成 CDN/对象存储）──
    # 同上：变量式，避免 agent 重建换 IP 后打到别处。
    location /generated/ {
        set $agent_be http://agent:8000;
        proxy_pass $agent_be;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ── 调用监控面板（独立 dashboard 容器，纯静态前端）──
    # 精确匹配 /dashboard 时 302 到带斜杠的目录，避免相对路径资源 404。
    location = /dashboard {
        return 302 /dashboard/;
    }
    # 面板静态资源走 dashboard 容器；API/SSE 仍走上面的 location / 反代到 agent。
    # 变量式 + rewrite 去前缀（等价于原来的 proxy_pass http://dashboard:80/）。
    location /dashboard/ {
        set $dashboard_be http://dashboard:80;
        rewrite ^/dashboard/?(.*)$ /$1 break;
        proxy_pass $dashboard_be;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── 客户体验演示页（纯静态，挂载自宿主机 ./demo）──
    # 改前端 = 覆盖 ./demo/index.html，无需重建容器、无需 reload。
    location = /demo {
        return 302 /demo/;
    }
    location /demo/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /demo/index.html;
    }

    # ── 演示后端（独立容器 flora-agent-demo + 独立数据库；SSE 不缓冲）──
    # 用**变量**声明上游：DNS 延迟到请求时解析，因此即便未启用 demo profile，
    # nginx 也能正常启动（仅该路径返回 502），不会因 "host not found in upstream" 起不来。
    location /demo-api/ {
        # ── 跨域（**仅演示沙箱**）──
        # 目的：demo/index.html 可从任意来源调用（本地 file:// 双击打开、拷到其它站点、
        # 本地静态服务器预览）。演示容器用独立库 flora_demo，不接触生产数据，故可放宽。
        # ⚠️ 后端若自带 CORS 头会与 nginx 重复 → 浏览器拒收，故统一由 nginx 发、并屏蔽后端头。
        # ⚠️⚠️ 预检必须放在 rewrite 之前：`rewrite ... break` 会终止本 location 后续
        #     rewrite 阶段指令（含 if），放在后面会失效 → 请求被转发给后端并返回 400。
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;
            add_header Access-Control-Max-Age       86400 always;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;
        add_header Access-Control-Max-Age       86400 always;

        set $demo_upstream http://agent-demo:8000;
        rewrite ^/demo-api/?(.*)$ /$1 break;
        proxy_pass $demo_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式对话支持（/demo-api/chat/stream）
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
