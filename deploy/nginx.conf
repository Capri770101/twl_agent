# 花艺智能体 Nginx 反向代理配置（api.tiaowulan.com）
#
# 证书统一放在 deploy/certs/（compose 挂载到 /etc/nginx/certs）：
#   fullchain.pem  证书链
#   privkey.pem    私钥
#
# 来源一（推荐，大陆服务器）：阿里云免费证书（数字证书管理服务 → 免费证书 → 下载 Nginx 格式）
#   有效期 3 个月，到期需重新申请下载并覆盖这两个文件，然后 sudo docker restart flora-nginx
# 来源二：Let's Encrypt（本服务器对 acme-v02 出站被墙，仅备用）
#   sudo docker run --rm -p 80:80 -v /opt/flora_agent_package/deploy/letsencrypt:/etc/letsencrypt \
#     certbot/certbot certonly --standalone -d api.tiaowulan.com -n --agree-tos --register-unsafely-without-email
#   签发后 cp deploy/letsencrypt/live/api.tiaowulan.com/{fullchain,privkey}.pem deploy/certs/
#   自动续期：deploy/renew-cert.sh（已配 root cron，每周一凌晨 3 点）

# HTTP：ACME 验证 + 全量跳转 HTTPS
server {
    listen 80;
    server_name api.tiaowulan.com;

    # Let's Encrypt HTTP-01 验证路径（续期用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.tiaowulan.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 上传/请求体上限（对话消息一般很小，图片上传场景可调大）
    client_max_body_size 10m;

    # ── 智能体 API ──
    location / {
        proxy_pass http://agent:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式对话支持（/chat/stream）
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── 生图结果静态托管（可选：也可换成 CDN/对象存储）──
    location /generated/ {
        proxy_pass http://agent:8000/generated/;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
